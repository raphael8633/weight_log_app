<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入體重系統</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f9f9f9;
      }
      form {
        background: white;
        padding: 2em;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 320px;
      }
      h2 {
        margin-bottom: 1em;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 0.75em;
        margin: 0.5em 0;
        font-size: 1em;
      }
      button {
        width: 100%;
        padding: 0.75em;
        font-size: 1em;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <form method="POST" action="/login">
      <h2>登入體重系統</h2>
      <input type="text" name="username" placeholder="帳號" required />
      <input type="password" name="password" placeholder="密碼" required />
      <button type="submit">登入</button>
    </form>
  </body>
</html>
